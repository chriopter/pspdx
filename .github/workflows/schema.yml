# The standard's site: README.md as the page, the two schemas as files beside
# it. GitHub's page for a file in the repository is HTML, and a validator
# asked to fetch a schema from there gets a web page instead of JSON; Pages
# serves .json as application/json. The schema URLs must never go away, so
# the build refuses to publish without them and the live URLs are checked
# after every deploy.
name: Schemas

on:
  push:
    branches: [master]
    paths: ["schema/**", ".github/build.py", "README.md", ".github/workflows/schema.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the site
        run: |
          pip install --quiet jsonschema markdown
          python3 .github/build.py _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment

  # Once a day and after every deploy: both schema URLs answer with the
  # schema that names that URL, and the page still links them.
  live:
    needs: deploy
    if: always() && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Check the live URLs
        run: |
          base=https://chriopter.github.io/pspdx
          for try in 1 2 3 4 5 6; do
            ok=1
            for name in pspdx-v1.json catalog-v1.json; do
              url=$base/schema/$name
              id=$(curl -fsSL "$url" | python3 -c 'import json,sys; print(json.load(sys.stdin)["$id"])') || id=
              if [ "$id" = "$url" ]; then echo "ok $url"; else echo "not yet: $url"; ok=0; fi
              curl -fsSL "$base/" | grep -q "href=\"schema/$name\"" || { echo "page lacks schema/$name"; ok=0; }
            done
            [ $ok = 1 ] && exit 0
            sleep 30
          done
          echo "::error::a schema URL is down or wrong"; exit 1
