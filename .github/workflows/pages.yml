name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that is already running; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Generate site
        run: |
          mkdir -p _site
          python3 catalog/build.py _site/catalog.json
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>PSPDX</title>
          <h1>PSPDX</h1>
          <p>PSP Download Index. The client fetches <a href="catalog.json">catalog.json</a>.</p>
          HTML
          mkdir -p _site/v1
          cat > _site/v1/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>PSPDX format v1</title>
          <h1>PSPDX format v1</h1>
          <p>Every catalog and every <code>app.pspdx</code> manifest names this
          page in its <code>schema</code> field, so a file says where it came
          from without anyone having to recognise it.</p>
          <p>The two formats are described in
          <a href="https://github.com/chriopter/pspdx/blob/master/docs/manifest.md">docs/manifest.md</a>.
          A later version of the format gets its own URL rather than a new
          number in this one.</p>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
