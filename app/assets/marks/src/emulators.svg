<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 17 17">
  <!-- A chip: another machine, which is what an emulator is pretending to
       be. Two pins a side, on whole pixels; three would close up into a
       comb and four sides would be a hedgehog. -->
  <g fill="#ffffff">
    <rect x="1" y="6" width="2" height="2"/>
    <rect x="1" y="10" width="2" height="2"/>
    <rect x="14" y="6" width="2" height="2"/>
    <rect x="14" y="10" width="2" height="2"/>
  </g>
  <rect x="4" y="4" width="9" height="9" rx="1.2" fill="none"
        stroke="#ffffff" stroke-width="2"/>
</svg>
