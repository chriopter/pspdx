<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 17 17">
  <!-- The system's own turning arrows, from update_plugin's 24 px sign: two
       arcs of a broken ring, each ending in a solid head twice the width of
       the arc it finishes. The second is the first turned half around. -->
  <defs>
    <g id="arm">
      <path d="M4.746 5.350 A4.9 4.9 0 0 1 13.326 7.649" fill="none"
            stroke="#ffffff" stroke-width="2.1"/>
      <path d="M13.831 10.506 L15.395 7.284 L11.257 8.014 Z" fill="#ffffff"
            stroke="#ffffff" stroke-width="0.5" stroke-linejoin="round"/>
    </g>
  </defs>
  <use href="#arm"/>
  <use href="#arm" transform="rotate(180 8.5 8.5)"/>
</svg>
