<svg xmlns="http://www.w3.org/2000/svg" width="43" height="14" viewBox="0 0 43 14">
  <!-- The system's own SELECT button as it stands in its dialogs: a dark
       pill with the word in light letters and a thin light rim. The pill's
       fill is not here, coverage is white, but in select_shadow.svg,
       which is the black twin the shell paints under every mark anyway. -->
  <rect x="1.5" y="1.5" width="40" height="11" rx="5.5" fill="none"
        stroke="#ffffff" stroke-width="1"/>
  <text x="21.5" y="10.6" text-anchor="middle" fill="#ffffff"
        font-family="Nimbus Sans Narrow, Liberation Sans Narrow, DejaVu Sans Condensed, sans-serif"
        font-weight="bold" font-size="9.4" letter-spacing="0.3">SELECT</text>
</svg>
