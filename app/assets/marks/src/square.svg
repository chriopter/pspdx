<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 13 13">
  <!-- Corners barely rounded: enough that the joins are not points, not so
       much that it stops being the square button. The path sits on whole
       pixels so a two-pixel stroke covers exactly two, as the original's
       does; half a pixel out and every edge goes grey. -->
  <rect x="2" y="2" width="9" height="9" rx="1" fill="none"
        stroke="#ffffff" stroke-width="2"/>
</svg>
