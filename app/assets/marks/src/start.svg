        stroke="#ffffff" stroke-width="1.5"/>
  <path d="M7.7 2.9 L11.5 4.5 L7.7 6.1 Z" fill="#ffffff" stroke="#ffffff"
        stroke-width="0.5" stroke-linejoin="round"/>
</svg>
